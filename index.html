<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D3 Bar Chart</title>

    <!-- Load D3.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 30px;
        background: #f8fafc;
      }

      .chart-container {
        max-width: 700px;
        margin: 0 auto;
        padding: 24px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }

      h2 {
        margin-top: 0;
        color: #1e293b;
      }

      .bar {
        fill: #3b82f6;
        transition: fill 0.2s;
      }

      .bar:hover {
        fill: #1d4ed8;
      }

      .axis text {
        font-size: 12px;
        fill: #64748b;
      }

      .axis path,
      .axis line {
        stroke: #cbd5e1;
      }

      .value-label {
        font-size: 12px;
        font-weight: bold;
        fill: #334155;
        text-anchor: middle;
      }

      .grid line {
        stroke: #e2e8f0;
        stroke-dasharray: 3 3;
      }

      .grid path {
        display: none;
      }

      svg {
        width: 100%;
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="chart-container">
      <h2>Values by Category and other stuff</h2>
      <div id="chart"></div>
    </div>

    <script>
      const data = [
        { name: "A", value: 1 },
        { name: "B", value: 5 },
        { name: "C", value: 8 },
        { name: "D", value: 10 },
      ];

      const margin = { top: 25, right: 20, bottom: 40, left: 45 };
      const width = 650;
      const height = 350;

      const innerWidth = width - margin.left - margin.right;
      const innerHeight = height - margin.top - margin.bottom;

      const svg = d3
        .select("#chart")
        .append("svg")
        .attr("viewBox", `0 0 ${width} ${height}`)
        .attr("role", "img")
        .attr("aria-label", "Bar chart showing values A: 1, B: 5, C: 8, D: 10");

      const chart = svg
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      // X scale: categories
      const x = d3
        .scaleBand()
        .domain(data.map((d) => d.name))
        .range([0, innerWidth])
        .padding(0.3);

      // Y scale: values
      const y = d3
        .scaleLinear()
        .domain([0, d3.max(data, (d) => d.value)])
        .nice()
        .range([innerHeight, 0]);

      // Horizontal grid lines
      chart
        .append("g")
        .attr("class", "grid")
        .call(d3.axisLeft(y).tickSize(-innerWidth).tickFormat(""));

      // X axis
      chart
        .append("g")
        .attr("class", "axis")
        .attr("transform", `translate(0,${innerHeight})`)
        .call(d3.axisBottom(x));

      // Y axis
      chart.append("g").attr("class", "axis").call(d3.axisLeft(y).ticks(5));

      // Bars
      chart
        .selectAll(".bar")
        .data(data)
        .join("rect")
        .attr("class", "bar")
        .attr("x", (d) => x(d.name))
        .attr("y", (d) => y(d.value))
        .attr("width", x.bandwidth())
        .attr("height", (d) => innerHeight - y(d.value))
        .attr("rx", 4)
        .append("title")
        .text((d) => `${d.name}: ${d.value}`);

      // Value labels above each bar
      chart
        .selectAll(".value-label")
        .data(data)
        .join("text")
        .attr("class", "value-label")
        .attr("x", (d) => x(d.name) + x.bandwidth() / 2)
        .attr("y", (d) => y(d.value) - 8)
        .text((d) => d.value);
    </script>
  </body>
</html>
